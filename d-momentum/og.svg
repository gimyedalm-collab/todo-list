<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafaf7"/>
      <stop offset="1" stop-color="#f1efe9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top: section number -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" letter-spacing="2" fill="#6e6e6e">
    <line x1="80" y1="100" x2="120" y2="100" stroke="#d12d2d" stroke-width="2"/>
    <text x="136" y="106" font-weight="500">N° 01 — TALENT MANAGEMENT</text>
  </g>

  <!-- Center: huge wordmark with italic D -->
  <g transform="translate(80, 320)">
    <text font-family="'Times New Roman', serif" font-style="italic" font-size="240" font-weight="400" fill="#0a0a0a" letter-spacing="-12">D</text>
    <text x="148" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="500" fill="#0a0a0a" letter-spacing="-8">momentum</text>
    <text x="1064" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="500" fill="#d12d2d" letter-spacing="-8">.</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 400)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#2a2a2a" letter-spacing="-1">
      Talent is momentum.
    </text>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(80, 530)" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" letter-spacing="2" fill="#6e6e6e">
    <text>GLOBAL TALENT MANAGEMENT · EST. 2024 · SEOUL</text>
  </g>

  <!-- Bottom right: artist credit -->
  <g transform="translate(1120, 530)" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#6e6e6e">
    <text>ARTIST · 001 · DASHA TARAN</text>
  </g>

  <!-- Subtle decorative line -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#0a0a0a" stroke-opacity="0.1" stroke-width="1"/>
</svg>
