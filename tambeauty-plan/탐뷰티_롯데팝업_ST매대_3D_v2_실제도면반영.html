<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      탐뷰티 × 롯데 — ST 매대 3D v2 (도면 반영 · 2단 셸프 · 깔끔 진열)
    </title>
    <style>
      :root {
        --pale: #ffebf1;
        --soft: #fcc5d2;
        --pink: #f5a0b5;
        --rose: #c44b6e;
        --rose-deep: #9d3653;
        --ink: #1a1a1a;
        --gray: #6b6b6b;
        --line: #e8d8dd;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #ffebf1, #e2d4ee);
        font-family:
          'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'AppleGothic',
          system-ui, sans-serif;
        color: var(--ink);
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        z-index: 10;
        pointer-events: none;
      }
      .hud-top {
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }
      .title-card,
      .legend {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(157, 54, 83, 0.14);
        pointer-events: auto;
      }
      .title-card {
        max-width: 480px;
      }
      .title-card .tag {
        display: inline-block;
        background: var(--rose-deep);
        color: #fff;
        padding: 3px 10px;
        border-radius: 100px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 6px;
      }
      .title-card h1 {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin-bottom: 4px;
      }
      .title-card p {
        font-size: 11.5px;
        color: var(--gray);
        line-height: 1.45;
      }
      .legend {
        font-size: 11px;
        line-height: 1.55;
        min-width: 220px;
      }
      .legend strong {
        display: block;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--rose-deep);
        margin-bottom: 8px;
      }
      .legend .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 3px;
      }
      .legend .row b {
        font-weight: 700;
        color: var(--ink);
      }
      .legend .dot {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        flex-shrink: 0;
      }
      .legend .dot.steel {
        background: linear-gradient(135deg, #d4d8dc, #a0a4a8);
      }
      .legend .dot.pink {
        background: linear-gradient(135deg, #f5a0b5, #c44b6e);
      }
      .legend .dot.banner {
        background: linear-gradient(135deg, #f5a0b5, #e2d4ee);
      }
      .legend .dot.mirror {
        background: linear-gradient(135deg, #e0e6e8, #c0c8cc);
        border-color: #999;
      }
      .legend .div {
        height: 1px;
        background: var(--line);
        margin: 6px 0;
      }
      .legend .spec {
        font-size: 10.5px;
        color: var(--gray);
        font-weight: 600;
        padding: 2px 0;
        letter-spacing: 0.02em;
      }
      .legend .spec b {
        color: var(--rose-deep);
      }
      .hud-bottom {
        bottom: 18px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: center;
      }
      .ctrl {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 8px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(157, 54, 83, 0.14);
        display: flex;
        gap: 4px;
        pointer-events: auto;
        flex-wrap: wrap;
        justify-content: center;
      }
      .ctrl button {
        background: transparent;
        border: 0;
        padding: 8px 14px;
        border-radius: 100px;
        font-size: 11.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
        transition: all 0.18s;
      }
      .ctrl button:hover {
        background: var(--pale);
      }
      .ctrl button.active {
        background: var(--rose-deep);
        color: #fff;
        box-shadow: 0 4px 12px rgba(157, 54, 83, 0.3);
      }
      .hint {
        position: fixed;
        bottom: 78px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(26, 26, 26, 0.7);
        color: #fff;
        font-size: 11px;
        padding: 7px 14px;
        border-radius: 100px;
        letter-spacing: 0.04em;
        z-index: 9;
        animation: fade 7s ease forwards;
        pointer-events: none;
      }
      @keyframes fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (max-width: 768px) {
        .hud-top {
          flex-direction: column;
        }
        .title-card {
          max-width: 100%;
        }
        .title-card h1 {
          font-size: 14px;
        }
        .legend {
          font-size: 10.5px;
        }
        .ctrl button {
          padding: 7px 11px;
          font-size: 10.5px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div class="hud hud-top">
        <div class="title-card">
          <span class="tag"
            >ST 매대 · 3D v2 · 깔끔 진열 (가격/와블러/POP 없음)</span
          >
          <h1>탐뷰티 ST 매대 3D — 사진 무드 그대로</h1>
          <p>
            큰 헤더 백드롭 · 양옆 "탐"+"뷰" · 2단 셸프에 핑크 박스 균일 진열 ·
            미러만 추가
          </p>
        </div>
        <div class="legend">
          <strong>구성 범례</strong>
          <div class="row">
            <span class="dot steel"></span><b>스틸 메탈 골격</b>
          </div>
          <div class="row">
            <span class="dot banner"></span><b>광고 배너 백드롭</b>
          </div>
          <div class="row">
            <span class="dot pink"></span><b>핑크 박스</b> · 균일 진열
          </div>
          <div class="row">
            <span class="dot mirror"></span><b>거울</b> · 체험용
          </div>
          <div class="div"></div>
          <div class="spec">실측 · <b>W2,455 × H2,700mm</b></div>
          <div class="spec">3섹션 · <b>805 + 805 + 805</b></div>
          <div class="spec">셸프 · <b>2단</b> (사진 그대로)</div>
        </div>
      </div>

      <div class="hint">마우스 드래그 회전 · 휠 줌 · 우클릭 이동</div>

      <div class="hud hud-bottom">
        <div class="ctrl">
          <button data-view="hero" class="active">전체뷰</button>
          <button data-view="front">정면</button>
          <button data-view="left">좌측 (탐)</button>
          <button data-view="right">우측 (뷰)</button>
          <button data-view="back">뒷면</button>
          <button data-view="shelf">셸프 클로즈업</button>
          <button data-view="header">헤더 클로즈업</button>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

      const canvas = document.getElementById('scene');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfdeef2);
      scene.fog = new THREE.Fog(0xfdeef2, 18, 40);

      const camera = new THREE.PerspectiveCamera(
        38,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(4.5, 2.0, 5);

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 1.8;
      controls.maxDistance = 18;
      controls.maxPolarAngle = Math.PI / 2.05;
      controls.target.set(0, 1.35, 0);

      // ─── 조명 ───
      scene.add(new THREE.AmbientLight(0xfff0f4, 0.6));
      const key = new THREE.DirectionalLight(0xffeede, 1.05);
      key.position.set(5, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -6;
      key.shadow.camera.right = 6;
      key.shadow.camera.top = 6;
      key.shadow.camera.bottom = -6;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffc8d4, 0.4);
      fill.position.set(-3, 3, -2);
      scene.add(fill);
      const rim = new THREE.PointLight(0xff9bb5, 0.45, 8);
      rim.position.set(0, 2.5, -2);
      scene.add(rim);

      // ─── 바닥 ───
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(12, 64),
        new THREE.MeshStandardMaterial({
          color: 0xfff4f7,
          roughness: 0.6,
          metalness: 0.05,
        }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // ============================================================
      // 도면 사이즈 + 사진 비율 반영
      // W2.455 × H2.7 × D0.6, 3섹션
      // 사진 비율: 큰 헤더(약 50%) + 2단 셸프(약 35%) + 드로어(약 15%)
      // ============================================================
      const ST_W = 2.455;
      const ST_H = 2.7;
      const ST_D = 0.6;
      const SECTION_W = 0.805;
      const DRAWER_H = 0.32;
      const HEADER_H = 1.35; // 큰 헤더 (사진 비율)
      // 셸프 2단 (드로어 위 → 헤더 아래 = 2.7 - 1.35 - 0.32 = 1.03m)
      // 두 셸프를 0.32, 0.85 위치에 (각 셸프 사이 공간 0.5m)
      const SHELF_Y = [1.05, 0.55]; // 상단 / 하단 (셸프 상판 높이)

      // ─── 스틸 머티리얼 ───
      const steelMat = new THREE.MeshStandardMaterial({
        color: 0xd4d8dc,
        roughness: 0.35,
        metalness: 0.88,
      });
      const steelDarkMat = new THREE.MeshStandardMaterial({
        color: 0xa0a4a8,
        roughness: 0.3,
        metalness: 0.92,
      });
      const shelfBoardMat = new THREE.MeshStandardMaterial({
        color: 0xe8ebee,
        roughness: 0.35,
        metalness: 0.7,
      });

      // ─── 4 코너 + 중간 2 = 수직 메탈 봉 8개 ───
      const postR = 0.02;
      [
        [-ST_W / 2, -ST_D / 2],
        [ST_W / 2, -ST_D / 2],
        [-ST_W / 2, ST_D / 2],
        [ST_W / 2, ST_D / 2],
        [-SECTION_W / 2, -ST_D / 2],
        [SECTION_W / 2, -ST_D / 2],
        [-SECTION_W / 2, ST_D / 2],
        [SECTION_W / 2, ST_D / 2],
      ].forEach(([x, z]) => {
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(postR, postR, ST_H, 16),
          steelMat,
        );
        post.position.set(x, ST_H / 2, z);
        post.castShadow = true;
        scene.add(post);
      });

      // ─── 상단 가로 빔 4개 ───
      [
        { len: ST_W + 0.04, axis: 'x', x: 0, z: -ST_D / 2 },
        { len: ST_W + 0.04, axis: 'x', x: 0, z: ST_D / 2 },
        { len: ST_D + 0.04, axis: 'z', x: -ST_W / 2, z: 0 },
        { len: ST_D + 0.04, axis: 'z', x: ST_W / 2, z: 0 },
      ].forEach((b) => {
        const beam = new THREE.Mesh(
          new THREE.BoxGeometry(
            b.axis === 'x' ? b.len : 0.035,
            0.035,
            b.axis === 'z' ? b.len : 0.035,
          ),
          steelDarkMat,
        );
        beam.position.set(b.x, ST_H - 0.018, b.z);
        beam.castShadow = true;
        scene.add(beam);
      });

      // ─── 2단 셸프 (앞/뒤 양면) ───
      function makeShelfBoard(y, isFront) {
        const board = new THREE.Mesh(
          new THREE.BoxGeometry(ST_W - 0.06, 0.025, ST_D / 2 - 0.04),
          shelfBoardMat,
        );
        const z = isFront ? ST_D / 4 + 0.005 : -(ST_D / 4 + 0.005);
        board.position.set(0, y + 0.012, z);
        board.castShadow = true;
        board.receiveShadow = true;
        scene.add(board);
        // 앞 엣지 (스틸)
        const edge = new THREE.Mesh(
          new THREE.BoxGeometry(ST_W - 0.06, 0.032, 0.012),
          steelDarkMat,
        );
        const ez = isFront ? ST_D / 2 - 0.018 : -(ST_D / 2 - 0.018);
        edge.position.set(0, y + 0.016, ez);
        scene.add(edge);
      }
      SHELF_Y.forEach((y) => {
        makeShelfBoard(y, true);
        makeShelfBoard(y, false);
      });

      // ─── 헤더 백드롭 (캔버스로 광고 배너를 정확한 비율로 합성) ───
      const headerY = ST_H - HEADER_H / 2 - 0.04;
      const headerBoardMat = new THREE.MeshStandardMaterial({
        color: 0xf5a0b5,
        roughness: 0.5,
      });

      // 헤더 합성 캔버스 (헤더 비율 1.89:1 → 광고 배너 비율 3.81:1)
      const headerCV = document.createElement('canvas');
      headerCV.width = 2400;
      headerCV.height = 1270;
      const hctx = headerCV.getContext('2d');
      // 핑크 그라데이션 배경 (광고 배너 위/아래 채움)
      const headerGrad = hctx.createLinearGradient(0, 0, 0, 1270);
      headerGrad.addColorStop(0, '#f5a0b5');
      headerGrad.addColorStop(1, '#e88aa5');
      hctx.fillStyle = headerGrad;
      hctx.fillRect(0, 0, 2400, 1270);

      const headerTex = new THREE.CanvasTexture(headerCV);
      headerTex.colorSpace = THREE.SRGBColorSpace;
      headerTex.anisotropy = MAX_ANISO;
      headerTex.minFilter = THREE.LinearMipmapLinearFilter;

      // 광고 배너 이미지 비동기 로드 후 가운데에 정확한 비율로 합성
      const bannerImg = new Image();
      bannerImg.onload = () => {
        const bH = 2400 / 3.81; // 광고 배너 비율 그대로 = 630
        const bY = (1270 - bH) / 2; // 세로 가운데
        hctx.drawImage(bannerImg, 0, bY, 2400, bH);
        // 상단 띠: LOTTE × POP-UP
        hctx.fillStyle = 'rgba(0,0,0,0.55)';
        hctx.fillRect(0, 0, 2400, bY);
        hctx.fillStyle = '#fff';
        hctx.font =
          '900 110px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        hctx.textAlign = 'center';
        hctx.textBaseline = 'middle';
        hctx.letterSpacing = '20px';
        hctx.fillText('LOTTE × TAM BEAUTY · POP-UP STORE', 1200, bY / 2);
        // 하단 띠: THE CLOUD × THE JELLY
        const bottomBandY = bY + bH;
        hctx.fillStyle = 'rgba(157,54,83,0.85)';
        hctx.fillRect(0, bottomBandY, 2400, 1270 - bottomBandY);
        hctx.fillStyle = '#fff';
        hctx.font =
          '900 95px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        hctx.fillText(
          'THE CLOUD ✦ THE JELLY  ·  전제품 시즌 라인업',
          1200,
          bottomBandY + (1270 - bottomBandY) / 2,
        );
        headerTex.needsUpdate = true;
      };
      bannerImg.src = 'images/tam-banner.jpg';

      const headerFrontMat = new THREE.MeshStandardMaterial({
        map: headerTex,
        roughness: 0.5,
      });

      const headerFaces = [
        headerBoardMat,
        headerBoardMat,
        headerBoardMat,
        headerBoardMat,
        headerFrontMat, // +Z 앞면 (합성된 배너)
        headerBoardMat, // -Z 뒷면
      ];
      const header = new THREE.Mesh(
        new THREE.BoxGeometry(ST_W - 0.06, HEADER_H - 0.08, 0.05),
        headerFaces,
      );
      header.position.set(0, headerY, ST_D / 2 - 0.005);
      header.castShadow = true;
      scene.add(header);

      // 뒷면 헤더 (단색 핑크 — Brand B 영역)
      const headerBack = new THREE.Mesh(
        new THREE.BoxGeometry(ST_W - 0.06, HEADER_H - 0.08, 0.05),
        new THREE.MeshStandardMaterial({
          color: 0xe88aa5,
          roughness: 0.55,
        }),
      );
      headerBack.position.set(0, headerY, -ST_D / 2 + 0.005);
      headerBack.castShadow = true;
      scene.add(headerBack);

      // ─── 사이드 임팩트 한글 패널 ("탐" / "뷰") ───
      function makeSidePanel(text, xPos) {
        const g = new THREE.Group();
        // 본체 (핑크 패널)
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, ST_H, ST_D + 0.04),
          new THREE.MeshStandardMaterial({
            color: 0xf5a0b5,
            roughness: 0.5,
          }),
        );
        body.castShadow = true;
        g.add(body);
        // 한글 1글자 (양면)
        const cv = document.createElement('canvas');
        cv.width = 1024;
        cv.height = 2048;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#fff';
        ctx.font =
          '900 1100px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, cv.width / 2, cv.height / 2);
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = MAX_ANISO;
        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(ST_D + 0.04, ST_H - 0.2),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true }),
        );
        plane.rotation.y = xPos > 0 ? Math.PI / 2 : -Math.PI / 2;
        plane.position.x = xPos > 0 ? 0.031 : -0.031;
        g.add(plane);
        g.position.set(xPos, ST_H / 2, 0);
        return g;
      }
      scene.add(makeSidePanel('탐', -ST_W / 2 - 0.09));
      scene.add(makeSidePanel('뷰', +ST_W / 2 + 0.09));

      // ─── 하단 드로어 ───
      function makeDrawer() {
        const g = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(ST_W - 0.06, DRAWER_H, ST_D - 0.04),
          new THREE.MeshStandardMaterial({
            color: 0xc8ccd0,
            roughness: 0.4,
            metalness: 0.8,
          }),
        );
        body.position.y = DRAWER_H / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        g.add(body);
        // 앞면 3섹션 칸막이
        [-SECTION_W / 2, SECTION_W / 2].forEach((x) => {
          [-1, 1].forEach((s) => {
            const div = new THREE.Mesh(
              new THREE.BoxGeometry(0.015, DRAWER_H - 0.02, 0.02),
              steelDarkMat,
            );
            div.position.set(x, DRAWER_H / 2, s * (ST_D / 2 - 0.015));
            g.add(div);
          });
        });
        // 손잡이 (각 섹션 가로 바)
        [0, -SECTION_W, SECTION_W].forEach((cx) => {
          [-1, 1].forEach((s) => {
            const handle = new THREE.Mesh(
              new THREE.CylinderGeometry(0.008, 0.008, SECTION_W * 0.5, 12),
              steelDarkMat,
            );
            handle.rotation.z = Math.PI / 2;
            handle.position.set(cx, DRAWER_H * 0.55, s * (ST_D / 2 - 0.01));
            g.add(handle);
          });
        });
        return g;
      }
      scene.add(makeDrawer());

      // ─── 핑크 박스 (사진 그대로 — 균일 큐브 박스) ───
      function makePinkBox() {
        const g = new THREE.Group();
        const w = 0.16,
          h = 0.16,
          d = 0.13;
        // 본체
        const body = new THREE.Mesh(
          new RoundedBoxGeometry(w, h, d, 2, 0.008),
          new THREE.MeshStandardMaterial({
            color: 0xf5a0b5,
            roughness: 0.55,
            metalness: 0.08,
          }),
        );
        body.position.y = h / 2;
        body.castShadow = true;
        g.add(body);
        // 앞면 작은 tam BEAUTY 라벨 (사진처럼 박스에 미니 일러스트)
        const cv = document.createElement('canvas');
        cv.width = 512;
        cv.height = 512;
        const ctx = cv.getContext('2d');
        // 핑크 배경
        ctx.fillStyle = '#f5a0b5';
        ctx.fillRect(0, 0, 512, 512);
        // 흰 원 (캐릭터 자리)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(256, 220, 110, 0, Math.PI * 2);
        ctx.fill();
        // 작은 미소 (얼굴 일러스트 약화)
        ctx.fillStyle = '#9d3653';
        ctx.beginPath();
        ctx.arc(220, 200, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(292, 200, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(256, 230, 35, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#9d3653';
        ctx.stroke();
        // tam BEAUTY 텍스트
        ctx.fillStyle = '#fff';
        ctx.font = '900 80px Pretendard, "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('tam', 256, 420);
        ctx.font = '700 36px Pretendard, sans-serif';
        ctx.fillText('BEAUTY', 256, 470);
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = MAX_ANISO;
        const labelPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(w * 0.98, h * 0.98),
          new THREE.MeshBasicMaterial({ map: tex }),
        );
        labelPlane.position.set(0, h / 2, d / 2 + 0.002);
        g.add(labelPlane);
        return g;
      }

      // 셸프당 7개 균일 진열 × 2단 × 앞/뒤 = 28개
      const BOX_PER_SHELF = 7;
      SHELF_Y.forEach((sy) => {
        [true, false].forEach((isFront) => {
          for (let i = 0; i < BOX_PER_SHELF; i++) {
            const box = makePinkBox();
            const x = -ST_W / 2 + (ST_W / (BOX_PER_SHELF + 1)) * (i + 1);
            const z = isFront ? ST_D / 4 + 0.005 : -(ST_D / 4 + 0.005);
            box.position.set(x, sy + 0.025, z);
            if (!isFront) box.rotation.y = Math.PI;
            scene.add(box);
          }
        });
      });

      // ─── 받침대 위 미러 (체험존 — 2단 하단 셸프 위 좌·우 코너) ───
      function makeMirror(xPos) {
        const g = new THREE.Group();
        // 미러 프레임
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, 0.32, 0.025),
          new THREE.MeshStandardMaterial({
            color: 0xc8c8c8,
            roughness: 0.45,
            metalness: 0.6,
          }),
        );
        g.add(frame);
        // 미러 면
        const mirror = new THREE.Mesh(
          new THREE.PlaneGeometry(0.18, 0.28),
          new THREE.MeshPhysicalMaterial({
            color: 0xdfe6e8,
            roughness: 0.05,
            metalness: 1.0,
            envMapIntensity: 1.0,
          }),
        );
        mirror.position.z = 0.014;
        g.add(mirror);
        // 받침대 (스탠드)
        const stand = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.04, 0.05),
          new THREE.MeshStandardMaterial({
            color: 0xa8a8a8,
            metalness: 0.7,
          }),
        );
        stand.position.y = -0.17;
        g.add(stand);
        g.position.set(xPos, 0.18 + SHELF_Y[1], ST_D / 4 + 0.005);
        return g;
      }
      // 하단 셸프 좌·우 끝에 미러 배치
      scene.add(makeMirror(-ST_W / 2 + 0.18));
      scene.add(makeMirror(+ST_W / 2 - 0.18));

      // ─── 카메라 뷰 프리셋 ───
      const views = {
        hero: { pos: [4.5, 2.0, 5], target: [0, 1.35, 0] },
        front: { pos: [0, 1.5, 4.2], target: [0, 1.35, 0] },
        left: { pos: [-4.8, 1.5, 2.0], target: [0, 1.35, 0] },
        right: { pos: [4.8, 1.5, 2.0], target: [0, 1.35, 0] },
        back: { pos: [0, 1.5, -4.2], target: [0, 1.35, 0] },
        shelf: { pos: [0, 1.1, 1.8], target: [0, 0.85, 0.2] },
        header: { pos: [0, 2.2, 2.5], target: [0, 2.0, 0] },
      };
      function setView(name) {
        const v = views[name];
        if (!v) return;
        const sp = camera.position.clone(),
          st = controls.target.clone();
        const ep = new THREE.Vector3(...v.pos),
          et = new THREE.Vector3(...v.target);
        const t0 = performance.now();
        const dur = 700;
        function tween() {
          const t = Math.min(1, (performance.now() - t0) / dur);
          const e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          camera.position.lerpVectors(sp, ep, e);
          controls.target.lerpVectors(st, et, e);
          controls.update();
          if (t < 1) requestAnimationFrame(tween);
        }
        tween();
      }
      document.querySelectorAll('.ctrl button').forEach((b) => {
        b.addEventListener('click', () => {
          document
            .querySelectorAll('.ctrl button')
            .forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          setView(b.dataset.view);
        });
      });

      // ─── 렌더 루프 ───
      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
