<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="emberA" cx="80%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#d97742" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberB" cx="10%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8c2f24" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8c2f24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97742" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d97742" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97742" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0807"/>
  <rect width="1200" height="630" fill="url(#emberA)"/>
  <rect width="1200" height="630" fill="url(#emberB)"/>

  <!-- Faint kanji 炭 in background -->
  <text
    x="1080" y="540"
    text-anchor="end"
    font-family="'Shippori Mincho','Noto Serif KR',serif"
    font-weight="700"
    font-size="420"
    fill="#d97742"
    fill-opacity="0.08"
  >炭</text>

  <!-- Top label -->
  <text
    x="80" y="120"
    font-family="'Shippori Mincho','Noto Serif KR',serif"
    font-weight="600"
    font-size="24"
    letter-spacing="8"
    fill="#d97742"
  >炭火とんかつ · TSUKU</text>

  <!-- Divider -->
  <rect x="80" y="148" width="220" height="1.5" fill="url(#line)"/>

  <!-- Main title KR -->
  <text
    x="80" y="295"
    font-family="'Noto Serif KR','Shippori Mincho',serif"
    font-weight="500"
    font-size="92"
    fill="#f4ede3"
    letter-spacing="-1"
  >숯불에 입힌,</text>
  <text
    x="80" y="405"
    font-family="'Noto Serif KR','Shippori Mincho',serif"
    font-weight="600"
    font-size="92"
    fill="#d97742"
    letter-spacing="-1"
  >군산 단 한 곳의 카츠.</text>

  <!-- Bottom meta -->
  <text
    x="80" y="540"
    font-family="'Noto Sans KR',sans-serif"
    font-weight="400"
    font-size="22"
    letter-spacing="6"
    fill="#b8ab9b"
  >TSUKU · GUNSAN · NAUN-DONG</text>

  <!-- Corner marker -->
  <circle cx="1110" cy="115" r="6" fill="#d97742"/>
  <text
    x="1130" y="122"
    font-family="'Shippori Mincho',serif"
    font-size="20"
    fill="#c9a961"
    letter-spacing="3"
  >限定</text>
</svg>
