<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김예닮 | 온라인 명함</title>
    <meta name="description" content="김예닮 Kim Ye Darm — 온라인 명함" />
    <meta property="og:title" content="김예닮 | 온라인 명함" />
    <meta property="og:description" content="Kim Ye Darm · 온다마케팅" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c1c22;
        --muted: #8a8a96;
        --line: #ececf0;
        --accent: #b89a6a; /* soft champagne gold */
        --accent-deep: #9c7f4f;
        --bg: #f4f2ee;
        --card: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Noto Sans KR', system-ui, sans-serif;
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            #ffffff 0%,
            rgba(255, 255, 255, 0) 55%
          ),
          linear-gradient(160deg, #f6f4f0 0%, #eceae4 100%);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 28px 18px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 24px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 30px 70px -24px rgba(40, 35, 25, 0.35),
          0 8px 24px -12px rgba(40, 35, 25, 0.22);
        overflow: hidden;
        position: relative;
        animation: rise 0.8s cubic-bezier(0.16, 0.84, 0.34, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* top band */
      .head {
        position: relative;
        padding: 46px 32px 30px;
        background: linear-gradient(
          155deg,
          #222229 0%,
          #2c2c35 60%,
          #34343f 100%
        );
        color: #fff;
        text-align: center;
        overflow: hidden;
      }
      .head::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          420px 200px at 78% -30%,
          rgba(184, 154, 106, 0.45),
          transparent 60%
        );
        pointer-events: none;
      }
      .monogram {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, var(--accent), var(--accent-deep));
        color: #fff;
        font-family: 'Cormorant Garamond', serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 1px;
        box-shadow:
          0 8px 22px -8px rgba(184, 154, 106, 0.8),
          0 0 0 6px rgba(255, 255, 255, 0.06);
        position: relative;
        z-index: 1;
      }
      .name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 1;
      }
      .name-en {
        margin-top: 7px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 17px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        position: relative;
        z-index: 1;
      }
      .role {
        margin-top: 16px;
        display: inline-block;
        position: relative;
        z-index: 1;
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--accent);
        padding: 5px 14px;
        border: 1px solid rgba(184, 154, 106, 0.45);
        border-radius: 999px;
      }

      /* contact list */
      .body {
        padding: 14px 22px 26px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 12px;
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        transition:
          background 0.25s ease,
          transform 0.15s ease;
      }
      .row + .row {
        border-top: 1px solid var(--line);
      }
      .row:active {
        transform: scale(0.99);
      }
      @media (hover: hover) {
        .row:hover {
          background: #faf8f4;
        }
      }
      .ic {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #f3eee4, #ece4d3);
        color: var(--accent-deep);
      }
      .ic svg {
        width: 20px;
        height: 20px;
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .label {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .val {
        font-size: 15.5px;
        font-weight: 500;
        color: var(--ink);
        word-break: break-all;
      }

      /* actions */
      .actions {
        display: flex;
        gap: 10px;
        padding: 4px 22px 24px;
      }
      .btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 0;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.25s ease,
          opacity 0.2s;
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: linear-gradient(145deg, #2b2b33, #3a3a45);
        color: #fff;
        box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.6);
      }
      .btn-ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .foot {
        text-align: center;
        padding: 0 22px 24px;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%) translateY(20px);
        background: #2b2b33;
        color: #fff;
        font-size: 13px;
        padding: 11px 20px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s ease;
        z-index: 50;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="head">
        <div class="monogram">Y</div>
        <h1 class="name">김예닮</h1>
        <div class="name-en">Kim Ye Darm</div>
        <span class="role">온다마케팅 · ONDA MARKETING</span>
      </header>

      <section class="body">
        <a class="row" href="tel:01093554951">
          <span class="ic">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </span>
          <span class="meta">
            <span class="label">Mobile</span>
            <span class="val">010-9355-4951</span>
          </span>
        </a>

        <a class="row" href="mailto:ondamarketing@naver.com">
          <span class="ic">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-10 6L2 7" />
            </svg>
          </span>
          <span class="meta">
            <span class="label">Email</span>
            <span class="val">ondamarketing@naver.com</span>
          </span>
        </a>
      </section>

      <div class="actions">
        <a class="btn btn-primary" href="tel:01093554951">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
            />
          </svg>
          전화하기
        </a>
        <button class="btn btn-ghost" id="saveBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
            />
            <path d="M17 21v-8H7v8M7 3v5h8" />
          </svg>
          연락처 저장
        </button>
      </div>

      <p class="foot">© ONDA MARKETING · Kim Ye Darm</p>
    </main>

    <div class="toast" id="toast">연락처(vCard)가 저장되었습니다</div>

    <script>
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:김예닮;;;;',
        'FN:김예닮 (Kim Ye Darm)',
        'ORG:온다마케팅 ONDA MARKETING',
        'TEL;TYPE=CELL:+82-10-9355-4951',
        'EMAIL;TYPE=INTERNET:ondamarketing@naver.com',
        'END:VCARD',
      ].join('\r\n');

      document.getElementById('saveBtn').addEventListener('click', function () {
        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'KimYeDarm.vcf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      });
    </script>
  </body>
</html>
