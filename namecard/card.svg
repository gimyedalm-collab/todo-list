<svg width="1080" height="600" viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232b"/>
      <stop offset="0.55" stop-color="#2c2c35"/>
      <stop offset="1" stop-color="#34343f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8bd86"/>
      <stop offset="0.5" stop-color="#b89a6a"/>
      <stop offset="1" stop-color="#9c7f4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#b89a6a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b89a6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="600" rx="40" fill="url(#bg)"/>
  <rect width="1080" height="600" rx="40" fill="url(#glow)"/>

  <!-- thin gold frame -->
  <rect x="26" y="26" width="1028" height="548" rx="24" fill="none" stroke="#b89a6a" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- left vertical accent + monogram -->
  <circle cx="150" cy="300" r="62" fill="url(#gold)"/>
  <text x="150" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#ffffff" text-anchor="middle">Y</text>

  <!-- divider -->
  <line x1="262" y1="150" x2="262" y2="450" stroke="#b89a6a" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- name -->
  <text x="312" y="210" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="2">김예닮</text>
  <text x="316" y="256" font-family="Georgia, serif" font-size="26" letter-spacing="7" fill="#c9c9d2">KIM YE DARM</text>

  <!-- title pill -->
  <rect x="314" y="286" width="160" height="44" rx="22" fill="none" stroke="#b89a6a" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="394" y="315" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="22" font-weight="500" fill="#d8bd86" text-anchor="middle" letter-spacing="3">플래너</text>

  <!-- contact: phone -->
  <text x="316" y="408" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#8a8a96">MOBILE</text>
  <text x="316" y="442" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="30" font-weight="500" fill="#ffffff" letter-spacing="1">010-9355-4951</text>

  <!-- contact: email -->
  <text x="660" y="408" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#8a8a96">EMAIL</text>
  <text x="660" y="442" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="30" font-weight="500" fill="#ffffff">ondamarketing@naver.com</text>

  <!-- footer brand -->
  <text x="540" y="525" font-family="Georgia, serif" font-size="18" letter-spacing="6" fill="#b89a6a" text-anchor="middle">ONDA MARKETING</text>
</svg>
